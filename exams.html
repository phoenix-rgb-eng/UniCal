<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>UniCal – Exams</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;1,9..144,300&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="global.css"/>
  <style>
    .dl-list { display:flex; flex-direction:column; gap:10px; }
    .dl-card { background:var(--surface); border:1.5px solid var(--border); border-radius:var(--radius); padding:16px 18px; display:flex; align-items:center; gap:14px; box-shadow:var(--shadow-sm); animation:fadeUp 0.35s ease both; transition:box-shadow 0.15s,transform 0.15s; }
    .dl-card:hover { box-shadow:var(--shadow); transform:translateY(-1px); }
    .dl-card.done { opacity:0.55; }
    .dl-card.done .dl-title { text-decoration:line-through; }
    .dl-stripe { width:4px; align-self:stretch; border-radius:2px; flex-shrink:0; min-height:48px; }
    .dl-check { width:20px; height:20px; border-radius:50%; border:2px solid var(--border-med); flex-shrink:0; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:all 0.15s ease; background:transparent; }
    .dl-check:hover { border-color:var(--medium); }
    .dl-card.done .dl-check { background:var(--medium); border-color:var(--medium); }
    .dl-body { flex:1; min-width:0; }
    .dl-title { font-size:0.95rem; font-weight:500; margin-bottom:5px; }
    .dl-meta { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
    .dl-date { font-size:0.78rem; color:var(--text-muted); }
    .dl-actions { display:flex; gap:6px; flex-shrink:0; }
    .exam-location { display:inline-flex; align-items:center; gap:4px; font-size:0.72rem; color:var(--text-muted); background:var(--surface-2); padding:2px 8px; border-radius:99px; }
  </style>
</head>
<body>
  <a href="#main-content" class="skip-link">Skip to main content</a>
  <div class="app-shell">
    <aside class="sidebar" aria-label="Main navigation"></aside>
    <button id="navToggle" class="nav-toggle" aria-label="Open navigation menu" aria-expanded="false">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
    </button>
    <main class="main-content" id="main-content">
      <header class="page-header">
        <div><h1 class="page-title"><em>Exams</em></h1><p class="page-subtitle" id="exSubtitle">Loading…</p></div>
        <button class="btn btn-primary" onclick="openAdd()" aria-label="Add new exam">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>Add exam
        </button>
      </header>

      <div class="chip-row" role="group" aria-label="Filter exams by priority">
        <button class="chip active" onclick="setFilter('all',this)" aria-pressed="true">All</button>
        <button class="chip" onclick="setFilter('urgent',this)" aria-pressed="false">Urgent</button>
        <button class="chip" onclick="setFilter('high',this)" aria-pressed="false">High</button>
        <button class="chip" onclick="setFilter('medium',this)" aria-pressed="false">Medium</button>
        <button class="chip" onclick="setFilter('low',this)" aria-pressed="false">Low</button>
        <button class="chip" onclick="setFilter('done',this)" aria-pressed="false">Completed</button>
      </div>

      <div id="exList" class="dl-list" aria-label="Exams list" aria-live="polite"></div>
    </main>
  </div>

  <div class="modal-overlay" id="exModal" role="dialog" aria-modal="true" aria-labelledby="exModalTitle">
    <div class="modal">
      <div class="modal-header">
        <h2 class="modal-title" id="exModalTitle">Add <em>exam</em></h2>
        <button class="modal-close" onclick="closeModal()" aria-label="Close dialog">×</button>
      </div>
      <div class="field-group"><label class="field-label" for="ex-title">Title *</label><input class="field-input" id="ex-title" type="text" placeholder="e.g. Midterm exam" required aria-required="true"/></div>
      <div class="field-group"><label class="field-label" for="ex-course">Course *</label><select class="field-select" id="ex-course" required aria-required="true"></select></div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
        <div class="field-group"><label class="field-label" for="ex-due">Date *</label><input class="field-input" id="ex-due" type="date" required aria-required="true"/></div>
        <div class="field-group"><label class="field-label" for="ex-time">Time</label><input class="field-input" id="ex-time" type="time"/></div>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
        <div class="field-group"><label class="field-label" for="ex-location">Location</label><input class="field-input" id="ex-location" type="text" placeholder="e.g. Hall A"/></div>
        <div class="field-group"><label class="field-label" for="ex-priority">Priority</label>
          <select class="field-select" id="ex-priority"><option value="urgent" selected>Urgent</option><option value="high">High</option><option value="medium">Medium</option><option value="low">Low</option></select>
        </div>
      </div>
      <div class="field-group"><label class="field-label" for="ex-notes">Notes (optional)</label><textarea class="field-textarea" id="ex-notes" placeholder="Topics covered, format…" rows="2"></textarea></div>
      <div class="form-error" id="ex-error" role="alert" aria-live="polite"></div>
      <div class="modal-actions">
        <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
        <button class="btn btn-primary" onclick="saveEx()">Save exam</button>
      </div>
    </div>
  </div>

  <script src="data.js"></script>
  <script src="sidebar.js"></script>
  <script>
    requireAuth(); buildSidebar(); initMobileSidebar();
    var currentFilter='all', editingId=null;

    function setFilter(f,btn){currentFilter=f;document.querySelectorAll('.chip').forEach(function(c){c.classList.remove('active');c.setAttribute('aria-pressed','false');});btn.classList.add('active');btn.setAttribute('aria-pressed','true');render();}

    function render(){
      var all=getExams();
      var items=currentFilter==='done'?all.filter(function(d){return d.done;}):currentFilter==='all'?all.filter(function(d){return !d.done;}):all.filter(function(d){return !d.done&&d.priority===currentFilter;});
      items.sort(function(a,b){return a.due.localeCompare(b.due);});
      var pending=all.filter(function(d){return !d.done;}).length;
      document.getElementById('exSubtitle').textContent=pending+' upcoming exam'+(pending!==1?'s':'')+' · '+all.filter(function(d){return d.done;}).length+' completed';
      var list=document.getElementById('exList');list.innerHTML='';
      if(!items.length){list.innerHTML='<div class="empty-state"><div class="empty-state-icon">🎓</div><div class="empty-state-text">No exams here yet.<br>Add one to stay on top of things.</div></div>';return;}
      items.forEach(function(ex,i){
        var c=courseById(ex.course),days=daysUntil(ex.due);
        var urgencyLabel=days<0?'Passed':days===0?'Today':days+'d away';
        var urgencyColor=days<0?'var(--text-muted)':days<=3?'var(--urgent)':'var(--text-muted)';
        var timeStr=ex.time?' · '+fmtTime(ex.time):'';
        var locStr=ex.location?'<span class="exam-location"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>'+ex.location+'</span>':'';
        var card=document.createElement('article');
        card.className='dl-card'+(ex.done?' done':'');card.style.animationDelay=i*.05+'s';
        card.setAttribute('aria-label',ex.title+', due '+fmtDate(ex.due)+(ex.location?', at '+ex.location:''));
        card.innerHTML=
          '<div class="dl-stripe" style="background:'+c.bg+'" aria-hidden="true"></div>'+
          '<button class="dl-check" onclick="toggle('+ex.id+')" aria-label="'+(ex.done?'Mark as upcoming':'Mark as done')+': '+ex.title+'">'+(ex.done?'<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3" aria-hidden="true"><polyline points="20 6 9 17 4 12"/></svg>':'')+'</button>'+
          '<div class="dl-body"><div class="dl-title">'+ex.title+'</div><div class="dl-meta">'+
            '<span class="badge" style="background:'+c.bg+'33;color:'+c.dark+'">'+c.label+'</span>'+
            '<span class="badge badge-'+ex.priority+'">'+ex.priority+'</span>'+
            '<span class="dl-date">'+fmtDate(ex.due)+timeStr+'</span>'+
            locStr+
            (!ex.done?'<span class="dl-date" style="color:'+urgencyColor+';font-weight:600">'+urgencyLabel+'</span>':'')+
          '</div>'+(ex.notes?'<div class="dl-date" style="margin-top:4px">'+ex.notes+'</div>':'')+'</div>'+
          '<div class="dl-actions">'+
            '<button class="btn-icon" onclick="edit('+ex.id+')" aria-label="Edit '+ex.title+'" title="Edit"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4z"/></svg></button>'+
            '<button class="btn-icon" onclick="del('+ex.id+')" aria-label="Delete '+ex.title+'" title="Delete"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/></svg></button>'+
          '</div>';
        list.appendChild(card);
      });
    }

    function toggle(id){var all=getExams(),a=all.find(function(x){return x.id===id;});if(a){a.done=!a.done;saveExams(all);render();showToast(a.done?'Marked as done':'Marked as upcoming');}}
    function del(id){if(!confirm('Delete this exam?'))return;saveExams(getExams().filter(function(x){return x.id!==id;}));render();showToast('Exam deleted','info');}
    function edit(id){var a=getExams().find(function(x){return x.id===id;});if(!a)return;editingId=id;populateCourseSelect();document.getElementById('ex-title').value=a.title;document.getElementById('ex-course').value=a.course;document.getElementById('ex-due').value=a.due;document.getElementById('ex-time').value=a.time||'';document.getElementById('ex-location').value=a.location||'';document.getElementById('ex-priority').value=a.priority;document.getElementById('ex-notes').value=a.notes||'';document.getElementById('exModalTitle').innerHTML='Edit <em>exam</em>';document.getElementById('exModal').classList.add('open');}
    function openAdd(){editingId=null;populateCourseSelect();['ex-title','ex-notes','ex-location'].forEach(function(id){document.getElementById(id).value='';});document.getElementById('ex-due').value='';document.getElementById('ex-time').value='';document.getElementById('ex-priority').value='urgent';document.getElementById('ex-error').textContent='';document.getElementById('exModalTitle').innerHTML='Add <em>exam</em>';document.getElementById('exModal').classList.add('open');setTimeout(function(){document.getElementById('ex-title').focus();},100);}
    function closeModal(){document.getElementById('exModal').classList.remove('open');}
    function populateCourseSelect(){var sel=document.getElementById('ex-course');sel.innerHTML='';getCourses().forEach(function(c){var opt=document.createElement('option');opt.value=c.id;opt.textContent=c.label;sel.appendChild(opt);});}
    function saveEx(){
      var errEl=document.getElementById('ex-error');errEl.textContent='';
      var title=document.getElementById('ex-title').value.trim(),course=document.getElementById('ex-course').value,due=document.getElementById('ex-due').value,time=document.getElementById('ex-time').value,location=document.getElementById('ex-location').value.trim(),priority=document.getElementById('ex-priority').value,notes=document.getElementById('ex-notes').value.trim();
      if(!title){errEl.textContent='Please enter a title.';return;}if(!due){errEl.textContent='Please pick a date.';return;}
      var all=getExams();
      if(editingId){var a=all.find(function(x){return x.id===editingId;});if(a)Object.assign(a,{title:title,course:course,due:due,time:time,location:location,priority:priority,notes:notes});}
      else all.push({id:nextId(all),title:title,course:course,due:due,time:time,location:location,priority:priority,notes:notes,done:false});
      saveExams(all);closeModal();render();showToast(editingId?'Exam updated':'Exam added ✓');
    }
    document.getElementById('exModal').addEventListener('click',function(e){if(e.target===document.getElementById('exModal'))closeModal();});
    document.addEventListener('keydown',function(e){if(e.key==='Escape')closeModal();});
    render();
  </script>
</body>
</html>
