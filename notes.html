<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>UniCal – Notes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;1,9..144,300&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="global.css"/>
  <style>
    .notes-layout { display:grid; grid-template-columns:280px 1fr; gap:0; min-height:calc(100vh - 160px); background:var(--surface); border:1.5px solid var(--border); border-radius:var(--radius); overflow:hidden; box-shadow:var(--shadow-sm); }

    /* Sidebar list */
    .notes-sidebar { border-right:1px solid var(--border); display:flex; flex-direction:column; background:var(--surface-2); }
    .notes-sidebar-header { padding:16px; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; }
    .notes-sidebar-title { font-size:0.72rem; font-weight:600; letter-spacing:0.08em; text-transform:uppercase; color:var(--text-muted); }
    .notes-list { flex:1; overflow-y:auto; padding:8px; }
    .note-item { padding:12px; border-radius:var(--radius-sm); cursor:pointer; transition:background 0.12s; margin-bottom:4px; }
    .note-item:hover { background:var(--surface); }
    .note-item.active { background:var(--surface); box-shadow:var(--shadow-sm); }
    .note-item-title { font-size:0.88rem; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-bottom:2px; }
    .note-item-meta { font-size:0.7rem; color:var(--text-muted); display:flex; align-items:center; gap:6px; }
    .note-item-dot { width:8px; height:8px; border-radius:50%; flex-shrink:0; }
    .note-item-preview { font-size:0.72rem; color:var(--text-muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-top:3px; }

    .notes-empty { padding:32px 16px; text-align:center; color:var(--text-muted); font-size:0.85rem; }

    /* Editor */
    .notes-editor { display:flex; flex-direction:column; }
    .editor-toolbar { padding:12px 20px; border-bottom:1px solid var(--border); display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
    .editor-title-input { flex:1; min-width:180px; font-size:1.1rem; font-weight:500; font-family:var(--font-body); border:none; background:transparent; outline:none; color:var(--text); padding:4px 0; }
    .editor-title-input::placeholder { color:var(--text-muted); }
    .editor-course-select { padding:5px 10px; border:1.5px solid var(--border-med); border-radius:var(--radius-sm); background:var(--surface-2); font-size:0.78rem; color:var(--text); outline:none; appearance:none; cursor:pointer; }
    .editor-tabs { display:flex; gap:2px; background:var(--surface-2); border-radius:8px; padding:3px; }
    .editor-tab { padding:5px 12px; border:none; border-radius:6px; background:transparent; font-size:0.75rem; font-weight:500; color:var(--text-muted); cursor:pointer; transition:all 0.12s; }
    .editor-tab.active { background:var(--surface); color:var(--text); box-shadow:0 1px 4px rgba(0,0,0,0.06); }

    .editor-body { flex:1; display:flex; flex-direction:column; }
    .editor-write { flex:1; display:flex; }
    .editor-textarea { flex:1; border:none; outline:none; resize:none; padding:20px 24px; font-family:'DM Sans', monospace; font-size:0.9rem; line-height:1.7; color:var(--text); background:transparent; }
    .editor-textarea::placeholder { color:var(--text-muted); }

    .editor-preview { flex:1; padding:20px 24px; overflow-y:auto; display:none; }
    .editor-preview.active { display:block; }
    .editor-write.hidden { display:none; }

    /* Markdown preview styles */
    .md-preview { font-size:0.9rem; line-height:1.8; color:var(--text); }
    .md-preview h1 { font-family:var(--font-display); font-size:1.6rem; font-weight:300; margin:0 0 12px; }
    .md-preview h2 { font-family:var(--font-display); font-size:1.3rem; font-weight:300; margin:20px 0 8px; }
    .md-preview h3 { font-family:var(--font-display); font-size:1.1rem; font-weight:400; margin:16px 0 6px; }
    .md-preview p { margin:0 0 12px; }
    .md-preview ul, .md-preview ol { margin:0 0 12px; padding-left:24px; }
    .md-preview li { margin-bottom:4px; }
    .md-preview code { background:var(--surface-2); padding:2px 6px; border-radius:4px; font-size:0.82rem; font-family:monospace; }
    .md-preview pre { background:var(--surface-2); padding:14px 18px; border-radius:var(--radius-sm); overflow-x:auto; margin:0 0 12px; }
    .md-preview pre code { background:none; padding:0; }
    .md-preview blockquote { border-left:3px solid var(--border-med); padding-left:16px; color:var(--text-muted); margin:0 0 12px; font-style:italic; }
    .md-preview strong { font-weight:600; }
    .md-preview em { font-style:italic; }
    .md-preview hr { border:none; border-top:1px solid var(--border); margin:20px 0; }
    .md-preview a { color:var(--accent-slate); text-decoration:underline; }
    .md-preview img { max-width:100%; border-radius:var(--radius-sm); }

    .editor-footer { padding:10px 20px; border-top:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; font-size:0.72rem; color:var(--text-muted); }

    .editor-placeholder { flex:1; display:flex; align-items:center; justify-content:center; color:var(--text-muted); font-size:0.9rem; text-align:center; padding:40px; }

    @media (max-width:768px) {
      .notes-layout { grid-template-columns:1fr; min-height:auto; }
      .notes-sidebar { max-height:220px; border-right:none; border-bottom:1px solid var(--border); }
      .notes-editor { min-height:400px; }
    }
  </style>
</head>
<body>
  <a href="#main-content" class="skip-link">Skip to main content</a>
  <div class="app-shell">
    <aside class="sidebar" aria-label="Main navigation"></aside>
    <button id="navToggle" class="nav-toggle" aria-label="Open navigation menu" aria-expanded="false">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
    </button>
    <main class="main-content" id="main-content">
      <header class="page-header">
        <div><h1 class="page-title"><em>Notes</em></h1><p class="page-subtitle" id="notesSubtitle">Markdown notes linked to your courses.</p></div>
        <button class="btn btn-primary" onclick="createNote()" aria-label="New note">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>New note
        </button>
      </header>

      <div class="notes-layout">
        <div class="notes-sidebar">
          <div class="notes-sidebar-header">
            <span class="notes-sidebar-title" id="noteCount">0 notes</span>
            <button class="btn-icon" onclick="createNote()" aria-label="New note" title="New note">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            </button>
          </div>
          <div class="notes-list" id="notesList"></div>
        </div>
        <div class="notes-editor" id="notesEditor">
          <div class="editor-placeholder" id="editorPlaceholder">
            <div>
              <div style="font-size:2rem;margin-bottom:8px">📝</div>
              Select a note or create a new one.<br>
              <span style="font-size:0.78rem">Notes support markdown formatting.</span>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="data.js"></script>
  <script src="sidebar.js"></script>
  <script>
    requireAuth(); buildSidebar(); initMobileSidebar();

    var activeNoteId = null;
    var activeTab = 'write';
    var autoSaveTimer = null;

    function renderNotesList() {
      var notes = getNotes();
      document.getElementById('noteCount').textContent = notes.length + ' note' + (notes.length !== 1 ? 's' : '');
      var list = document.getElementById('notesList');
      list.innerHTML = '';
      if (!notes.length) {
        list.innerHTML = '<div class="notes-empty">No notes yet.<br>Click + to create one.</div>';
        return;
      }
      notes.sort(function(a, b) { return (b.updated || b.created || '').localeCompare(a.updated || a.created || ''); });
      notes.forEach(function(n) {
        var c = courseById(n.course);
        var preview = (n.content || '').replace(/[#*_`>\-\[\]()]/g, '').slice(0, 60);
        var item = document.createElement('div');
        item.className = 'note-item' + (n.id === activeNoteId ? ' active' : '');
        item.onclick = function() { openNote(n.id); };
        item.innerHTML =
          '<div class="note-item-title">' + (n.title || 'Untitled') + '</div>' +
          '<div class="note-item-meta">' +
            '<span class="note-item-dot" style="background:' + c.bg + '"></span>' +
            '<span>' + c.label + '</span>' +
            '<span>·</span>' +
            '<span>' + formatNoteDate(n.updated || n.created) + '</span>' +
          '</div>' +
          (preview ? '<div class="note-item-preview">' + preview + '</div>' : '');
        list.appendChild(item);
      });
    }

    function formatNoteDate(iso) {
      if (!iso) return '';
      var d = new Date(iso);
      var now = new Date();
      var diff = now - d;
      if (diff < 60000) return 'just now';
      if (diff < 3600000) return Math.floor(diff / 60000) + 'm ago';
      if (diff < 86400000) return Math.floor(diff / 3600000) + 'h ago';
      return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
    }

    function createNote() {
      var notes = getNotes();
      var courses = getCourses();
      var newNote = {
        id: Date.now(),
        title: 'Untitled note',
        content: '',
        course: courses.length ? courses[0].id : '',
        created: new Date().toISOString(),
        updated: new Date().toISOString()
      };
      notes.unshift(newNote);
      saveNotes(notes);
      activeNoteId = newNote.id;
      renderNotesList();
      renderEditor();
      showToast('Note created');
      setTimeout(function() {
        var titleInput = document.getElementById('editorTitleInput');
        if (titleInput) { titleInput.focus(); titleInput.select(); }
      }, 100);
    }

    function openNote(id) {
      activeNoteId = id;
      activeTab = 'write';
      renderNotesList();
      renderEditor();
    }

    function deleteNote(id) {
      if (!confirm('Delete this note?')) return;
      var notes = getNotes().filter(function(n) { return n.id !== id; });
      saveNotes(notes);
      if (activeNoteId === id) { activeNoteId = null; }
      renderNotesList();
      renderEditor();
      showToast('Note deleted', 'info');
    }

    function renderEditor() {
      var editor = document.getElementById('notesEditor');
      if (!activeNoteId) {
        editor.innerHTML = '<div class="editor-placeholder" id="editorPlaceholder"><div><div style="font-size:2rem;margin-bottom:8px">📝</div>Select a note or create a new one.<br><span style="font-size:0.78rem">Notes support markdown formatting.</span></div></div>';
        return;
      }
      var note = getNotes().find(function(n) { return n.id === activeNoteId; });
      if (!note) { activeNoteId = null; renderEditor(); return; }
      var c = courseById(note.course);
      var courses = getCourses();
      var courseOpts = courses.map(function(co) {
        return '<option value="' + co.id + '"' + (co.id === note.course ? ' selected' : '') + '>' + co.label + '</option>';
      }).join('');

      var wordCount = note.content ? note.content.trim().split(/\s+/).filter(function(w){return w;}).length : 0;

      editor.innerHTML =
        '<div class="editor-toolbar">' +
          '<input class="editor-title-input" id="editorTitleInput" value="' + escAttr(note.title) + '" placeholder="Note title…" oninput="onTitleChange(this.value)"/>' +
          '<select class="editor-course-select" id="editorCourseSelect" onchange="onCourseChange(this.value)" aria-label="Course">' + courseOpts + '</select>' +
          '<div class="editor-tabs">' +
            '<button class="editor-tab' + (activeTab === 'write' ? ' active' : '') + '" onclick="switchEditorTab(\'write\')">Write</button>' +
            '<button class="editor-tab' + (activeTab === 'preview' ? ' active' : '') + '" onclick="switchEditorTab(\'preview\')">Preview</button>' +
          '</div>' +
          '<button class="btn-icon" onclick="deleteNote(' + note.id + ')" aria-label="Delete note" title="Delete note" style="margin-left:auto">' +
            '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/></svg>' +
          '</button>' +
        '</div>' +
        '<div class="editor-body">' +
          '<div class="editor-write' + (activeTab !== 'write' ? ' hidden' : '') + '">' +
            '<textarea class="editor-textarea" id="editorTextarea" placeholder="Start writing in markdown…\n\n# Heading\n**Bold**, *italic*, `code`\n- List items\n> Blockquotes" oninput="onContentChange(this.value)">' + escHtml(note.content) + '</textarea>' +
          '</div>' +
          '<div class="editor-preview md-preview' + (activeTab === 'preview' ? ' active' : '') + '" id="editorPreview">' + renderMarkdown(note.content) + '</div>' +
        '</div>' +
        '<div class="editor-footer">' +
          '<span>' + wordCount + ' word' + (wordCount !== 1 ? 's' : '') + '</span>' +
          '<span>Last edited ' + formatNoteDate(note.updated) + '</span>' +
        '</div>';
    }

    function switchEditorTab(tab) {
      activeTab = tab;
      var note = getNotes().find(function(n) { return n.id === activeNoteId; });
      if (!note) return;
      /* Update preview content if switching to preview */
      if (tab === 'preview') {
        var textarea = document.getElementById('editorTextarea');
        if (textarea) note.content = textarea.value;
      }
      renderEditor();
    }

    function onTitleChange(val) {
      scheduleSave(function() {
        var notes = getNotes();
        var n = notes.find(function(x) { return x.id === activeNoteId; });
        if (n) { n.title = val; n.updated = new Date().toISOString(); saveNotes(notes); renderNotesList(); }
      });
    }

    function onCourseChange(val) {
      var notes = getNotes();
      var n = notes.find(function(x) { return x.id === activeNoteId; });
      if (n) { n.course = val; n.updated = new Date().toISOString(); saveNotes(notes); renderNotesList(); }
    }

    function onContentChange(val) {
      scheduleSave(function() {
        var notes = getNotes();
        var n = notes.find(function(x) { return x.id === activeNoteId; });
        if (n) {
          n.content = val;
          n.updated = new Date().toISOString();
          saveNotes(notes);
          /* Update word count */
          var wordCount = val.trim().split(/\s+/).filter(function(w){return w;}).length;
          var footer = document.querySelector('.editor-footer span:first-child');
          if (footer) footer.textContent = wordCount + ' word' + (wordCount !== 1 ? 's' : '');
        }
      });
    }

    function scheduleSave(fn) {
      if (autoSaveTimer) clearTimeout(autoSaveTimer);
      autoSaveTimer = setTimeout(fn, 400);
    }

    /* Simple markdown to HTML renderer */
    function renderMarkdown(md) {
      if (!md) return '<p style="color:var(--text-muted);font-style:italic">Nothing here yet. Switch to Write to start.</p>';
      var html = escHtml(md);

      /* Code blocks */
      html = html.replace(/```(\w*)\n([\s\S]*?)```/g, function(m, lang, code) {
        return '<pre><code>' + code.trim() + '</code></pre>';
      });

      /* Inline code */
      html = html.replace(/`([^`]+)`/g, '<code>$1</code>');

      /* Headers */
      html = html.replace(/^### (.+)$/gm, '<h3>$1</h3>');
      html = html.replace(/^## (.+)$/gm, '<h2>$1</h2>');
      html = html.replace(/^# (.+)$/gm, '<h1>$1</h1>');

      /* Bold and italic */
      html = html.replace(/\*\*\*(.+?)\*\*\*/g, '<strong><em>$1</em></strong>');
      html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
      html = html.replace(/\*(.+?)\*/g, '<em>$1</em>');

      /* Blockquotes */
      html = html.replace(/^&gt; (.+)$/gm, '<blockquote>$1</blockquote>');

      /* Horizontal rule */
      html = html.replace(/^---$/gm, '<hr>');

      /* Unordered lists */
      html = html.replace(/^[\-\*] (.+)$/gm, '<li>$1</li>');
      html = html.replace(/((?:<li>.*<\/li>\n?)+)/g, '<ul>$1</ul>');

      /* Ordered lists */
      html = html.replace(/^\d+\. (.+)$/gm, '<li>$1</li>');

      /* Links */
      html = html.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');

      /* Images */
      html = html.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<img src="$2" alt="$1"/>');

      /* Paragraphs — wrap remaining lines */
      html = html.split('\n\n').map(function(block) {
        block = block.trim();
        if (!block) return '';
        if (/^<(h[1-6]|ul|ol|li|pre|blockquote|hr|div|p)/.test(block)) return block;
        return '<p>' + block.replace(/\n/g, '<br>') + '</p>';
      }).join('\n');

      return html;
    }

    function escHtml(s) {
      return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    function escAttr(s) {
      return s.replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    renderNotesList();
    renderEditor();
  </script>
</body>
</html>
