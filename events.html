<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>UniCal – Events</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;1,9..144,300&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="global.css"/>
  <style>
    .dl-list { display:flex; flex-direction:column; gap:10px; }
    .dl-card { background:var(--surface); border:1.5px solid var(--border); border-radius:var(--radius); padding:16px 18px; display:flex; align-items:center; gap:14px; box-shadow:var(--shadow-sm); animation:fadeUp 0.35s ease both; transition:box-shadow 0.15s,transform 0.15s; }
    .dl-card:hover { box-shadow:var(--shadow); transform:translateY(-1px); }
    .dl-card.done { opacity:0.55; }
    .dl-card.done .dl-title { text-decoration:line-through; }
    .dl-stripe { width:4px; align-self:stretch; border-radius:2px; flex-shrink:0; min-height:48px; }
    .dl-check { width:20px; height:20px; border-radius:50%; border:2px solid var(--border-med); flex-shrink:0; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:all 0.15s ease; background:transparent; }
    .dl-check:hover { border-color:var(--medium); }
    .dl-card.done .dl-check { background:var(--medium); border-color:var(--medium); }
    .dl-body { flex:1; min-width:0; }
    .dl-title { font-size:0.95rem; font-weight:500; margin-bottom:5px; }
    .dl-meta { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
    .dl-date { font-size:0.78rem; color:var(--text-muted); }
    .dl-actions { display:flex; gap:6px; flex-shrink:0; }
  </style>
</head>
<body>
  <a href="#main-content" class="skip-link">Skip to main content</a>
  <div class="app-shell">
    <aside class="sidebar" aria-label="Main navigation"></aside>
    <button id="navToggle" class="nav-toggle" aria-label="Open navigation menu" aria-expanded="false">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
    </button>
    <main class="main-content" id="main-content">
      <header class="page-header">
        <div><h1 class="page-title"><em>Events</em></h1><p class="page-subtitle" id="evSubtitle">Loading…</p></div>
        <button class="btn btn-primary" onclick="openAdd()" aria-label="Add new event">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>Add event
        </button>
      </header>

      <div class="chip-row" role="group" aria-label="Filter events by priority">
        <button class="chip active" onclick="setFilter('all',this)" aria-pressed="true">All</button>
        <button class="chip" onclick="setFilter('urgent',this)" aria-pressed="false">Urgent</button>
        <button class="chip" onclick="setFilter('high',this)" aria-pressed="false">High</button>
        <button class="chip" onclick="setFilter('medium',this)" aria-pressed="false">Medium</button>
        <button class="chip" onclick="setFilter('low',this)" aria-pressed="false">Low</button>
        <button class="chip" onclick="setFilter('done',this)" aria-pressed="false">Past</button>
      </div>

      <div id="evList" class="dl-list" aria-label="Events list" aria-live="polite"></div>
    </main>
  </div>

  <div class="modal-overlay" id="evModal" role="dialog" aria-modal="true" aria-labelledby="evModalTitle">
    <div class="modal">
      <div class="modal-header">
        <h2 class="modal-title" id="evModalTitle">Add <em>event</em></h2>
        <button class="modal-close" onclick="closeModal()" aria-label="Close dialog">×</button>
      </div>
      <div class="field-group"><label class="field-label" for="ev-title">Title *</label><input class="field-input" id="ev-title" type="text" placeholder="e.g. Guest lecture" required aria-required="true"/></div>
      <div class="field-group"><label class="field-label" for="ev-course">Course *</label><select class="field-select" id="ev-course" required aria-required="true"></select></div>
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px">
        <div class="field-group"><label class="field-label" for="ev-due">Date *</label><input class="field-input" id="ev-due" type="date" required aria-required="true"/></div>
        <div class="field-group"><label class="field-label" for="ev-start">Start time</label><input class="field-input" id="ev-start" type="time"/></div>
        <div class="field-group"><label class="field-label" for="ev-end">End time</label><input class="field-input" id="ev-end" type="time"/></div>
      </div>
      <div class="field-group"><label class="field-label" for="ev-priority">Priority</label>
        <select class="field-select" id="ev-priority"><option value="urgent">Urgent</option><option value="high">High</option><option value="medium" selected>Medium</option><option value="low">Low</option></select>
      </div>
      <div class="field-group"><label class="field-label" for="ev-notes">Notes (optional)</label><textarea class="field-textarea" id="ev-notes" placeholder="Location, details…" rows="2"></textarea></div>
      <div class="form-error" id="ev-error" role="alert" aria-live="polite"></div>
      <div class="modal-actions">
        <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
        <button class="btn btn-primary" onclick="saveEv()">Save event</button>
      </div>
    </div>
  </div>

  <script src="data.js"></script>
  <script src="sidebar.js"></script>
  <script>
    requireAuth(); buildSidebar(); initMobileSidebar();
    var currentFilter='all', editingId=null;

    function setFilter(f,btn){currentFilter=f;document.querySelectorAll('.chip').forEach(function(c){c.classList.remove('active');c.setAttribute('aria-pressed','false');});btn.classList.add('active');btn.setAttribute('aria-pressed','true');render();}

    function render(){
      var all=getEvents();
      var items=currentFilter==='done'?all.filter(function(d){return d.done;}):currentFilter==='all'?all.filter(function(d){return !d.done;}):all.filter(function(d){return !d.done&&d.priority===currentFilter;});
      items.sort(function(a,b){return a.due.localeCompare(b.due);});
      var pending=all.filter(function(d){return !d.done;}).length;
      document.getElementById('evSubtitle').textContent=pending+' upcoming event'+(pending!==1?'s':'')+' · '+all.filter(function(d){return d.done;}).length+' past';
      var list=document.getElementById('evList');list.innerHTML='';
      if(!items.length){list.innerHTML='<div class="empty-state"><div class="empty-state-icon">📅</div><div class="empty-state-text">No events here yet.<br>Add one to get started.</div></div>';return;}
      items.forEach(function(ev,i){
        var c=courseById(ev.course),days=daysUntil(ev.due);
        var urgencyLabel=days<0?'Passed':days===0?'Today':days+'d away';
        var urgencyColor=days<0?'var(--text-muted)':days<=3?'var(--high)':'var(--text-muted)';
        var timeStr='';
        if(ev.timeStart)timeStr=' · '+fmtTime(ev.timeStart);
        if(ev.timeStart&&ev.timeEnd)timeStr+='–'+fmtTime(ev.timeEnd);
        var card=document.createElement('article');
        card.className='dl-card'+(ev.done?' done':'');card.style.animationDelay=i*.05+'s';
        card.setAttribute('aria-label',ev.title+', due '+fmtDate(ev.due));
        card.innerHTML=
          '<div class="dl-stripe" style="background:'+c.bg+'" aria-hidden="true"></div>'+
          '<button class="dl-check" onclick="toggle('+ev.id+')" aria-label="'+(ev.done?'Mark as upcoming':'Mark as past')+': '+ev.title+'">'+(ev.done?'<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3" aria-hidden="true"><polyline points="20 6 9 17 4 12"/></svg>':'')+'</button>'+
          '<div class="dl-body"><div class="dl-title">'+ev.title+'</div><div class="dl-meta">'+
            '<span class="badge" style="background:'+c.bg+'33;color:'+c.dark+'">'+c.label+'</span>'+
            '<span class="badge badge-'+ev.priority+'">'+ev.priority+'</span>'+
            '<span class="dl-date">'+fmtDate(ev.due)+timeStr+'</span>'+
            (!ev.done?'<span class="dl-date" style="color:'+urgencyColor+';font-weight:600">'+urgencyLabel+'</span>':'')+
          '</div>'+(ev.notes?'<div class="dl-date" style="margin-top:4px">'+ev.notes+'</div>':'')+'</div>'+
          '<div class="dl-actions">'+
            '<button class="btn-icon" onclick="edit('+ev.id+')" aria-label="Edit '+ev.title+'" title="Edit"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4z"/></svg></button>'+
            '<button class="btn-icon" onclick="del('+ev.id+')" aria-label="Delete '+ev.title+'" title="Delete"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/></svg></button>'+
          '</div>';
        list.appendChild(card);
      });
    }

    function toggle(id){var all=getEvents(),a=all.find(function(x){return x.id===id;});if(a){a.done=!a.done;saveEvents(all);render();showToast(a.done?'Marked as past':'Marked as upcoming');}}
    function del(id){if(!confirm('Delete this event?'))return;saveEvents(getEvents().filter(function(x){return x.id!==id;}));render();showToast('Event deleted','info');}
    function edit(id){var a=getEvents().find(function(x){return x.id===id;});if(!a)return;editingId=id;populateCourseSelect();document.getElementById('ev-title').value=a.title;document.getElementById('ev-course').value=a.course;document.getElementById('ev-due').value=a.due;document.getElementById('ev-start').value=a.timeStart||'';document.getElementById('ev-end').value=a.timeEnd||'';document.getElementById('ev-priority').value=a.priority;document.getElementById('ev-notes').value=a.notes||'';document.getElementById('evModalTitle').innerHTML='Edit <em>event</em>';document.getElementById('evModal').classList.add('open');}
    function openAdd(){editingId=null;populateCourseSelect();['ev-title','ev-notes'].forEach(function(id){document.getElementById(id).value='';});document.getElementById('ev-due').value='';document.getElementById('ev-start').value='';document.getElementById('ev-end').value='';document.getElementById('ev-priority').value='medium';document.getElementById('ev-error').textContent='';document.getElementById('evModalTitle').innerHTML='Add <em>event</em>';document.getElementById('evModal').classList.add('open');setTimeout(function(){document.getElementById('ev-title').focus();},100);}
    function closeModal(){document.getElementById('evModal').classList.remove('open');}
    function populateCourseSelect(){var sel=document.getElementById('ev-course');sel.innerHTML='';getCourses().forEach(function(c){var opt=document.createElement('option');opt.value=c.id;opt.textContent=c.label;sel.appendChild(opt);});}
    function saveEv(){
      var errEl=document.getElementById('ev-error');errEl.textContent='';
      var title=document.getElementById('ev-title').value.trim(),course=document.getElementById('ev-course').value,due=document.getElementById('ev-due').value,timeStart=document.getElementById('ev-start').value,timeEnd=document.getElementById('ev-end').value,priority=document.getElementById('ev-priority').value,notes=document.getElementById('ev-notes').value.trim();
      if(!title){errEl.textContent='Please enter a title.';return;}if(!due){errEl.textContent='Please pick a date.';return;}
      var all=getEvents();
      if(editingId){var a=all.find(function(x){return x.id===editingId;});if(a)Object.assign(a,{title:title,course:course,due:due,timeStart:timeStart,timeEnd:timeEnd,priority:priority,notes:notes});}
      else all.push({id:nextId(all),title:title,course:course,due:due,timeStart:timeStart,timeEnd:timeEnd,priority:priority,notes:notes,done:false});
      saveEvents(all);closeModal();render();showToast(editingId?'Event updated':'Event added ✓');
    }
    document.getElementById('evModal').addEventListener('click',function(e){if(e.target===document.getElementById('evModal'))closeModal();});
    document.addEventListener('keydown',function(e){if(e.key==='Escape')closeModal();});
    render();
  </script>
</body>
</html>
